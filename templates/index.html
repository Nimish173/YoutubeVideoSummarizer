<!DOCTYPE html>
<html>
<head>
  <title>YouTube Summarizer</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f4f4;
      transition: background-color 0.3s, color 0.3s;
    }

    .dark-mode {
      background-color: #121212;
      color: #fff;
    }

    .container {
      background-color: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 100%;
      max-width: 600px;
    }

    .dark-mode .container {
      background-color: #1e1e1e;
      color: #ddd;
    }

    input[type="text"], textarea, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    button {
      background-color: #4CAF50;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #loading {
      display: none;
      margin-top: 10px;
      font-size: 16px;
    }

    .toggle-btn {
      background-color: #222;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      position: absolute;
      top: 20px;
      right: 20px;
    }
  </style>
</head>
<body>
  <button class="toggle-btn" onclick="toggleDarkMode()">Toggle Dark Mode</button>
  <div class="container">
    <h2>YouTube Summarizer</h2>
    <form action="/summarize" method="post" onsubmit="showLoading()">
      <input type="text" name="youtube_link" placeholder="Enter YouTube Link" required>
      <select name="model">
        <option value="gemini-2.0-flash-001">Gemini 2.0 Flash</option>
      </select>
      <textarea name="additional_prompt" placeholder="Write your additional prompt here. For example: 'explain like I'm five.'"></textarea>
      <button type="submit">Summarize</button>
      <div id="loading">Generating summary... Please wait.</div>
    </form>
  </div>

  <script>
    function showLoading() {
      document.getElementById('loading').style.display = 'block';
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }
  </script>
</body>
</html>
